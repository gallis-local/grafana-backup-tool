name: Docker Image CI with Tag

on:
  push:
    branches:
      - master
    paths:
      - grafana_backup/**
      - Dockerfile    
      - DockerfileSlim
      - .github/workflows/docker-image.yml  
    tags:
      - '*'
  
jobs:
  push_to_registry:
    name: Push tagged docker image to GitHub Container Registry
    runs-on: [self-hosted, x64]
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_slim_digest: ${{ steps.build_slim.outputs.digest }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2

      # Only register QEMU/binfmt on GitHub-hosted runners. Self-hosted ARC
      # runners already have host-level binfmt from the cluster extension;
      # registering it again inside the pod fails ("no such file or directory")
      # and can panic the node. runner.environment == 'self-hosted' there.
      - name: Set up QEMU
        if: runner.environment == 'github-hosted'
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/grafana-backup-tool
          labels: |
            org.opencontainers.image.title=grafana-backup-tool
            org.opencontainers.image.description=Backup and restore tool for Grafana dashboards, datasources, and more.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.authors=${{ github.actor }}
            org.opencontainers.image.revision=${{ github.sha }}  
  
      - name: Extract metadata (tags, labels) for Docker (Slim version)
        id: meta_slim
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/grafana-backup-tool-slim
          flavor: |
            latest=auto
            suffix=-slim,onlatest=true
          labels: |
            org.opencontainers.image.title=grafana-backup-tool-slim
            org.opencontainers.image.description=Slim image of the Grafana backup/restore tool.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.authors=${{ github.actor }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image slim version
        id: build_slim
        uses: docker/build-push-action@v6
        with:
          file: ./DockerfileSlim
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_slim.outputs.tags }}
          labels: ${{ steps.meta_slim.outputs.labels }}


  security_scans:
    name: Security scans (Trivy)
    runs-on: [self-hosted, x64]
    needs: push_to_registry
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan (full image)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/grafana-backup-tool@${{ needs.push_to_registry.outputs.image_digest }}
          format: 'table'
          vuln-type: 'os,library'
          severity: 'MEDIUM'
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy scan (slim image)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/grafana-backup-tool-slim@${{ needs.push_to_registry.outputs.image_slim_digest }}
          format: 'table'
          vuln-type: 'os,library'
          severity: 'MEDIUM'
          ignore-unfixed: true
          exit-code: '1'
